; Skippy voice node: M5Stack Core2 as a wireless microphone + speaker for the
; /ws/voice lane. Build and flash with `pio run -t upload` from this directory.

[env:m5stack-core2]
platform = espressif32@^6.7.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200

; PSRAM holds the audio jitter buffer; the Core2 has 8MB of it.
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5Unified@^0.1.16
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4
