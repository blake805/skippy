; Skippy bench IO node: M5Stack Core2 (IoT Dev Kit v2) as a wireless UART /
; I2C / GPIO / ADC bridge for RE mode. Build and flash with `pio run -t upload`
; from this directory.

[env:m5stack-core2]
platform = espressif32@^6.7.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; The M5GO Bottom2 base's 10-LED side bar, which the IoT Dev Kit v2 ships
    ; with. Set LED_BAR_COUNT to 0 for a bare Core2 or a different base; the
    ; pin is unconnected there, so leaving it on is harmless either way.
    -DLED_BAR_PIN=25
    -DLED_BAR_COUNT=10

lib_deps =
    m5stack/M5Unified@^0.1.16
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit NeoPixel@^1.12.3
    ; The BLE transport (pinned to 1.x: the 2.x callback signatures differ).
    h2zero/NimBLE-Arduino@^1.4.2
