name: CI

on:
  push:
  pull_request:

env:
  # Never let a test reach the real NAS paths.
  SKIPPY_MEMORY_ROOT: ${{ github.workspace }}/.ci-tmp/skippy_memory
  SKIPPY_WORKSPACES_ROOT: ${{ github.workspace }}/.ci-tmp/skippy_workspaces
  SKIPPY_CHROMA_PATH: ${{ github.workspace }}/.ci-tmp/skippy_memory/chroma_db

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the production interpreter on the Mac Studio (3.11.15).
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run pytest
        run: python -m pytest

      # `python -m pytest` and the `pytest` console script disagree about how
      # sys.executable spells itself: the former reports `python`, the latter
      # `python3.11`. That difference hid a real gap in the command allowlist, which
      # refused the most ordinary invocation there is. Cheap to keep checking.
      - name: Run the execution tests through the console script
        run: pytest tests/test_exec.py -q

  offline:
    name: Python tests (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # The *suite* must pass with the internet unplugged. That used to be a claim
      # about Skippy himself; since ADR 0022 he reads the web on purpose, and this
      # job is now about the tests: every model endpoint, search backend and page
      # fetch has a fake in front of it, and a test that quietly reached the real
      # internet would be one that fails on someone's train. The namespace has
      # nothing but loopback, so such a test fails here instead. The runner's own
      # agent stays outside the namespace and can still report the result.
      # sudo rather than --map-root-user: Ubuntu 24.04 restricts unprivileged user
      # namespaces via AppArmor, so the unprivileged form fails on this runner.
      - name: Run pytest with only loopback available
        run: |
          sudo -E env "PATH=$PATH" unshare --net -- \
            sh -c 'ip link set lo up && python -m pytest'

  lint:
    name: pyflakes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pyflakes
        run: pip install pyflakes

      # No exclusions: every module in the tree is expected to be clean. If that
      # becomes painful, fix the module rather than adding it to an ignore list.
      - name: Run pyflakes
        run: python -m pyflakes *.py tests/

  extension:
    name: Cursor extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cursor_client/package-lock.json

      - name: Install
        run: npm ci
        working-directory: cursor_client

      # The compile is the type check: the extension talks to the VS Code API and to
      # the hub's wire protocol, and neither one tells you at runtime that a field is
      # missing until the moment it matters.
      - name: Compile
        run: npx tsc -p ./
        working-directory: cursor_client

      # Includes the parity table, which is the only thing keeping the editor's patch
      # semantics from drifting away from the server's. tests/test_cursor.py runs the
      # same table on the Python side.
      - name: Test
        run: node --test test/*.test.js
        working-directory: cursor_client
